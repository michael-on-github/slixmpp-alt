when:
  event: [ push, pull_request ]
  path: [ "pyproject.toml", "docs/*", "**/*.py" ]

steps:
  setup_venv:
    image: codeberg.org/poezio/slixmpp:ci
    commands:
    - uv sync --frozen --all-extras --group docs
  build_doc:
    image: codeberg.org/poezio/slixmpp:ci
    commands:
    - mkdir out
    - uv run sphinx-build docs out
