when:
  event: [ push, pull_request ]
  path: [ "**/*.py", "uv.lock", "Cargo.toml", ".woodpecker/test-integration.yml", "**/*.rs"  ]

variables:
  - &common
    image: codeberg.org/poezio/slixmpp:ci
    depends_on: []
    commands:
      - uv sync --frozen --all-extras --all-groups
      - ./run_integration_tests.py

steps:
  test_integration:
    <<: *common
    when:
      event: push
      branch: master
    environment:
      CI_ACCOUNT1:
        from_secret: ci_account1
      CI_ACCOUNT1_PASSWORD:
        from_secret: ci_account1_password
      CI_ACCOUNT2:
        from_secret: ci_account2
      CI_ACCOUNT2_PASSWORD:
        from_secret: ci_account2_password
      CI_MUC_SERVER:
        from_secret: ci_muc_server

  test_integration_local:
    <<: *common
    when:
      event: [ push, pull_request ]
    environment:
      CI_ACCOUNT1: slix-ci-1@prosody
      CI_ACCOUNT1_PASSWORD: slix-ci-1-pass
      CI_ACCOUNT2: slix-ci-2@prosody
      CI_ACCOUNT2_PASSWORD: slix-ci-2-pass
      CI_MUC_SERVER: muc.prosody

services:
  prosody:
    image: codeberg.org/poezio/slixmpp:prosody
    pull: true
